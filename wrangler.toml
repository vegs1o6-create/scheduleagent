name = "familiebot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Ikke slett variabler som er lagt inn i Cloudflare-dashboardet ved deploy.
keep_vars = true
# Gjør workeren tilgjengelig på https://familiebot.<subdomene>.workers.dev
workers_dev = true

[observability]
enabled = true

# KV for tilstand: utkast, siste oppføring, ukeplan-historikk, token-cache.
# Kjør `npx wrangler kv namespace create STATE` og lim inn id-en her.
[[kv_namespaces]]
binding = "STATE"
id = "991f1816853e4327bdf17b49061856a6"

# Tyngre jobber (Claude-kall, PDF-analyse) kjøres i en kø, slik at
# Telegram-webhooken alltid kan svare 200 med en gang.
[[queues.producers]]
binding = "JOBS"
queue = "familiebot-jobs"

[[queues.consumers]]
queue = "familiebot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 0

# 1) Hvert 5. minutt: se etter nye ukeplaner i Google Drive-mappen.
# 2) Søndag kl. 18:00 Europe/Oslo. Cron kjører i UTC, så vi trigger både 16:00
#    og 17:00 UTC og sjekker lokal tid i koden (håndterer sommertid).
# Uttrykkene må stemme med CRON_DRIVE_POLL / CRON_SUNDAY i src/index.ts.
[triggers]
crons = ["*/5 * * * *", "0 16,17 * * SUN"]

[vars]
TIMEZONE = "Europe/Oslo"
GOOGLE_CALENDAR_ID = "499d12834b64c2295b7cb8cbc7a44dfcce198b9552f204263cd5cf42418a637c@group.calendar.google.com"
# Modell-leverandør: "foundry" (OpenAI-modell i Microsoft Foundry) eller "anthropic" (Claude).
AI_PROVIDER = "foundry"
# Endepunktet til Foundry-/Azure OpenAI-ressursen (Foundry-portalen → Oversikt/Keys and Endpoint).
# Både https://<ressurs>.openai.azure.com/ og https://<ressurs>.services.ai.azure.com/ fungerer.
FOUNDRY_ENDPOINT = "https://seiltips-resource.services.ai.azure.com/openai/v1/responses"
# Navnet du ga deploymenten i Foundry (Models + endpoints), ikke nødvendigvis modellnavnet.
FOUNDRY_DEPLOYMENT = "gpt-6-luna"
# low/medium/high for resonneringsmodeller (gpt-5-familien, o3/o4). Sett til "" for gpt-4.1/gpt-4o.
FOUNDRY_REASONING_EFFORT = "medium"
# Brukes bare når AI_PROVIDER = "anthropic".
CLAUDE_MODEL = "claude-sonnet-5-5"
CLAUDE_EFFORT = "medium"
REQUIRE_APPROVAL_FOR_TEXT = "false"
AUTO_APPROVE = "false"
# Google Calendar colorId: 9 = Blåbær (blå), 4 = Flamingo (rosa), 5 = Banan (gul).
CHILDREN = '[{"name":"Sverre","colorId":"9","aliases":["2C","2. klasse","klasse 2C"]},{"name":"Astrid","colorId":"4","aliases":["Friluftsgruppa","Tveteråsen","Tveteråsen barnehage","barnehagen"]}]'
BOTH_COLOR_ID = "5"
DEFAULT_EVENT_MINUTES = "60"
EVENT_REMINDER_MINUTES = "60"
LOW_CONFIDENCE = "0.7"
# Google Drive-mappen som overvåkes (ID-en fra URL-en drive.google.com/drive/folders/<ID>).
# Tom = Drive-inngangen er av.
DRIVE_FOLDER_ID = "1kljn8OYt8eo8684BMOLiiAZufFiR2I1C"
# Infoskjermen (/skjerm?key=<DISPLAY_KEY>): kalendere som vises (kommaseparert, tom = GOOGLE_CALENDAR_ID)
# og hvor mange dager frem. Nøkkelen settes med `npx wrangler secret put DISPLAY_KEY`.
DISPLAY_CALENDAR_IDS = ""
DISPLAY_DAYS = "14"
# Værvarsel fra Yr (MET Norway) øverst på infoskjermen. Breddegrad/lengdegrad for hjemmet ditt
# (høyreklikk på stedet i Google Maps for å kopiere dem). Tom = ingen vær. Standard: Oslo sentrum.
WEATHER_LAT = "59.9139"
WEATHER_LON = "10.7522"
